name: tests

on:
  # Other branches get their run from the pull request; a push run too would test the same commit twice.
  push:
    branches: [master]
  pull_request:

# Per ref: a new push cancels the unfinished run of the same pull request or of master, not of another one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -v

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install mypy==1.19.1 pyright==1.1.414
      - run: python3 -m mypy
      # What Pylance runs; it and mypy each catch mistakes the other misses.
      - run: python3 -m pyright

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check .
      - uses: astral-sh/ruff-action@v3
        with:
          args: format --check .

  # Hyprland's backend opens a DRM device to allocate buffers, and hosted
  # runners have no render node. They have KVM, so run.sh boots the image's own
  # kernel in a VM, where vkms makes a display-only card and Mesa renders with llvmpipe.
  live:
    runs-on: ubuntu-latest
    # A VM that hangs would otherwise hold the runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: tests/integration/run.sh
        env:
          OLS_CONTAINER: docker
          OLS_VM: '1'
