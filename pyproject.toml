[tool.ruff]
target-version = "py39"
line-length = 110
# The launcher has no .py extension, so discovery has to be told about it.
include = ["bin/omarchy-last-session", "omarchy_last_session/*.py", "tests/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.9"
strict = true
# Tests are left out: their fixtures are plain dicts from untyped helpers.
files = ["omarchy_last_session", "bin/omarchy-last-session"]
