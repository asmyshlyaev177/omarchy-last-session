<!doctype html>
<!-- Source of the marketplace preview. The card shows it at about a quarter of this size
and trims the top and bottom, so it is one large mark and the name, nothing small.
chromium --headless=new --disable-gpu --hide-scrollbars --window-size=1600,900 --force-device-scale-factor=2 \
  --user-data-dir="$(mktemp -d)" --screenshot=preview.png file://$PWD/docs/preview.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Last Session</title>
<style>
  :root { --bg: #1a1b26; --panel: #16161e; --line: #3b4261; --text: #c0caf5; --dim: #565f89; --blue: #7aa2f7; --green: #9ece6a; --purple: #bb9af7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text); font-family: "JetBrainsMono Nerd Font", "JetBrainsMono NF", "Liberation Mono", monospace;
    display: flex; align-items: center; justify-content: center; gap: 110px;
  }
  .mark { width: 470px; height: 330px; border: 5px solid var(--line); border-radius: 26px; background: var(--panel); padding: 20px; display: flex; flex-direction: column; gap: 18px; position: relative; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .dots { display: flex; gap: 12px; padding-left: 4px; }
  .dots span { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
  .tiles { flex: 1; display: grid; grid-template-columns: 1.25fr 1fr; grid-template-rows: 1fr 1fr; gap: 18px; }
  .tiles div { border-radius: 14px; }
  .tiles .a { grid-row: 1 / 3; background: rgba(122,162,247,.28); border: 3px solid var(--blue); }
  .tiles .b { background: rgba(158,206,106,.22); border: 3px solid rgba(158,206,106,.7); }
  .tiles .c { background: rgba(187,154,247,.22); border: 3px solid rgba(187,154,247,.7); }
  .badge { position: absolute; right: -48px; bottom: -48px; width: 150px; height: 150px; border-radius: 50%; background: var(--blue); color: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 96px; line-height: 1; box-shadow: 0 16px 40px rgba(0,0,0,.5); border: 6px solid var(--bg); }
  h1 { font-size: 150px; font-weight: 700; letter-spacing: -4px; line-height: .95; }
  h1 span { display: block; color: var(--blue); }
</style>
</head>
<body>
  <div class="mark">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="tiles"><div class="a"></div><div class="b"></div><div class="c"></div></div>
    <div class="badge">&#xF0453;</div>
  </div>
  <h1>Last<span>Session</span></h1>
</body>
</html>
